name: Build EZVIZ Bridge Test APK

on:
  push:
    paths:
      - "ezviz-bridge/**"
      - ".github/workflows/build-ezviz-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build EZVIZ bridge APK
        run: gradle -p ezviz-bridge assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EZVIZ-Bridge-Test-debug
          path: ezviz-bridge/app/build/outputs/apk/debug/app-debug.apk
