name: Build CCTV All-in-One APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout CloudCam upstream source
        uses: actions/checkout@v4
        with:
          repository: Bahrombekk/cloud-cam-viewer
          ref: 3d2f057ae138ef7320258caf2a8d3764b5e8114f
          path: cloudcam-upstream
      - name: Prepare embedded CloudCam Python package
        run: |
          mkdir -p app/src/main/python
          cp -a cloudcam-upstream/src/cloudcam app/src/main/python/
          cp cloudcam-upstream/LICENSE app/src/main/python/CLOUDCAM-LICENSE-MIT
          cp cloudcam-upstream/NOTICE app/src/main/python/CLOUDCAM-NOTICE
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Python 3.10 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CCTV-All-in-One-debug
          path: app/build/outputs/apk/debug/app-debug.apk
