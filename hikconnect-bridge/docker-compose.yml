services:
  hikconnect-bridge:
    build: .
    container_name: cctv-hikconnect-bridge
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CLOUDCAM_HOME: /data
      CLOUDCAM_BRIDGE_PORT: "8765"
    volumes:
      - hikconnect-data:/data
    ports:
      - "8765:8765" # bridge camera-list API
      - "8554:8554" # RTSP live streams
      - "8888:8888" # HLS (optional)
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8765), 3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

volumes:
  hikconnect-data:
